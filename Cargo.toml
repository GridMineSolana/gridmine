[workspace]
resolver = "2"
members = ["api", "program", "mock_vrf", "mock_swap"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GRID: a 25-asset board game on Solana (fork of ORE by Regolith Labs)."
keywords = ["solana"]

[workspace.dependencies]
bytemuck = "1.14.3"
grid-api = { path = "./api" }
num_enum = "0.7.2"
solana-program = "^2.1"
spl-token = { version = "^4", features = ["no-entrypoint"] }
spl-token-2022 = { version = "^7", features = ["no-entrypoint"] }
spl-associated-token-account = { version = "^6", features = ["no-entrypoint"] }
steel = { features = ["spl"], version = "4.0.9" }
thiserror = "1.0.57"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "s"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1

[profile.dev]
overflow-checks = true
